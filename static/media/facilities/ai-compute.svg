<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img"
     aria-label="Diagram of the lab's AI computing setup: RTX 5090 nodes and RTX A-series workstations writing to NAS storage, with rented capacity at the National AI Computing Center">
  <rect width="900" height="380" rx="10" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="none" stroke="#e2e8f0"/>
  <text x="32" y="46" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0f172a">AI Computing</text>
  <text x="32" y="70" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#64748b">Schematic, not a photograph &#183; capacity grows with each new grant</text>

  <!-- in-house nodes -->
  <rect x="32" y="100" width="380" height="186" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="126" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#475569">IN HOUSE</text>

  <g stroke="#334155" stroke-width="1.6" fill="#ffffff">
    <rect x="52" y="142" width="160" height="58" rx="5"/>
    <rect x="232" y="142" width="160" height="58" rx="5"/>
    <rect x="52" y="214" width="340" height="56" rx="5"/>
  </g>
  <g fill="#1d4ed8">
    <rect x="64"  y="156" width="30" height="30" rx="3"/>
    <rect x="100" y="156" width="30" height="30" rx="3"/>
    <rect x="136" y="156" width="30" height="30" rx="3"/>
    <rect x="244" y="156" width="30" height="30" rx="3"/>
    <rect x="280" y="156" width="30" height="30" rx="3"/>
  </g>
  <text x="178" y="178" font-family="system-ui,sans-serif" font-size="12" fill="#1e293b">&#215; n</text>
  <text x="62" y="214" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">RTX 5090 nodes</text>
  <text x="242" y="214" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">RTX A-series workstations</text>
  <g fill="#64748b">
    <rect x="68"  y="228" width="300" height="7" rx="3"/>
    <rect x="68"  y="240" width="300" height="7" rx="3"/>
    <rect x="68"  y="252" width="300" height="7" rx="3"/>
  </g>
  <text x="222" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">NAS storage &#8212; multimodal datasets, digital twins</text>

  <!-- rented capacity -->
  <rect x="520" y="100" width="348" height="186" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="540" y="126" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#475569">RENTED</text>
  <path d="M600 196 a40 40 0 0 1 78 -14 a32 32 0 0 1 28 56 h-96 a34 34 0 0 1 -10 -42 z"
        fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="694" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e293b">National AI Computing Center</text>

  <!-- link -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M414 190 L516 190"/>
  </g>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="465" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">burst</text>
  <text x="32" y="344" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Large training runs burst to rented capacity; day-to-day work stays on the lab's own machines.</text>
</svg>
