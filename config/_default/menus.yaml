# Navigation
#   `weight` sets the order; `parent` nests an item under the entry whose
#   `identifier` it names.
#
# Order was chosen deliberately: News first so the front page of the site
# leads with what is happening now, then the people, then the work.
#
# Projects and Facilities sit under Research rather than at the top level,
# which keeps the bar to seven items. Move them back out if they deserve
# their own slots.

main:
  - name: Home
    url: '/#about'
    weight: 10

  - name: News
    url: '/news'
    weight: 20

  - name: Team
    identifier: team
    url: '/authors'
    weight: 30
  - name: Professor
    parent: team
    url: '/members/professor'
    weight: 31
  - name: Current Members
    parent: team
    url: '/authors'
    weight: 32
  - name: Alumni
    parent: team
    url: '/members/alumni'
    weight: 33

  - name: Research
    identifier: research
    url: '/research'
    weight: 40
  - name: Research Areas
    parent: research
    url: '/research'
    weight: 41
  - name: Projects
    parent: research
    url: '/projects'
    weight: 42
  - name: Facilities
    parent: research
    url: '/facilities'
    weight: 43

  - name: Publications
    identifier: publications
    url: '/publications'
    weight: 50
  - name: Journals
    parent: publications
    url: '/publications/journals'
    weight: 51
  - name: Conferences
    parent: publications
    url: '/publications/conferences'
    weight: 52
  - name: Patents
    parent: publications
    url: '/publications/patents'
    weight: 53
  - name: Lectures
    parent: publications
    url: '/publications/lectures'
    weight: 54

  - name: Join Us
    url: '/opportunities'
    weight: 60

  - name: Contact
    url: '/contact'
    weight: 70

