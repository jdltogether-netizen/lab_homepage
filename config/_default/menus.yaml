# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: '/#about'
    weight: 10
  - name: Research
    url: '/research'
    weight: 20
  - name: Facilities
    url: '/facilities'
    weight: 25
  - name: Team
    identifier: team
    url: '/authors'
    weight: 30
  - name: Professor
    parent: team
    url: '/members/professor'
    weight: 31
  - name: Current Members
    parent: team
    url: '/authors'
    weight: 32
  - name: Alumni
    parent: team
    url: '/members/alumni'
    weight: 33
  - name: Publications
    identifier: publications
    url: '/publications'
    weight: 40
  - name: Journals
    parent: publications
    url: '/publications/journals'
    weight: 41
  - name: Conferences
    parent: publications
    url: '/publications/conferences'
    weight: 42
  - name: Patents
    parent: publications
    url: '/publications/patents'
    weight: 43
  - name: Lectures
    parent: publications
    url: '/publications/lectures'
    weight: 44
  # Hidden until real content replaces the template's sample events.
